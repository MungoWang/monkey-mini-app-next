packages:
  - packages/*
  - packages/*/*
  - apps/*

# pnpm 10+ blocks dependency install scripts until they are listed here.
# esbuild ships the native binary the test runner needs. lefthook installs git hooks.
allowBuilds:
  '@google/genai': true
  better-sqlite3: true
  esbuild: true
  lefthook: true
  protobufjs: true
