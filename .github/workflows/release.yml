name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  bundle:
    name: ${{ matrix.bundle }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            bundle: macOS-arm64
          - os: windows-latest
            arch: x64
            bundle: windows-x64
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Confirm runner architecture
        shell: bash
        run: node -e "if (process.arch !== '${{ matrix.arch }}') { console.error('runner arch is ' + process.arch); process.exit(1) }"
      - name: Confirm tag matches the shell version
        if: github.ref_type == 'tag'
        shell: bash
        run: node -e "const v=require('./packages/shell/package.json').version; const tag=process.env.GITHUB_REF_NAME.replace(/^v/,''); if (tag!==v) { console.error('tag '+tag+' is not shell version '+v); process.exit(1) }"
      - run: pnpm install --frozen-lockfile
      - run: pnpm dist:app:release
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        with:
          name: Mohou-${{ matrix.bundle }}
          if-no-files-found: error
          path: artifacts/app/Mohou-*-${{ matrix.bundle }}.*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
